version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: build
      include: scope
    groups:
      kubernetes:
        patterns:
          - k8s.io/*
          - sigs.k8s.io/*
    ignore:
      # Must stay at the commit hack/dpuagent/mock.ref pins; test/consistency
      # fails otherwise. Bump both together.
      - dependency-name: github.com/nvidia/doca-platform
      # Must match the CRDs in config/kubevirt-crds and KUBEVIRT_VERSION.
      - dependency-name: kubevirt.io/*
      # A Kubernetes minor release also moves the Kind node image, the guest
      # image's kubelet and the envtest version, so it is bumped by hand.
      - dependency-name: k8s.io/*
        update-types: ["version-update:semver-minor"]
      - dependency-name: sigs.k8s.io/controller-runtime
        update-types: ["version-update:semver-minor"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      github-actions:
        patterns:
          - "*"
