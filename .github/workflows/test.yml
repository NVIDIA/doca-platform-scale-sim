name: Unit tests

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - 'main'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: make test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Cache tool binaries
        uses: actions/cache@v4
        with:
          path: bin
          key: ${{ runner.os }}-bin-${{ hashFiles('go.mod', 'Makefile') }}

      - name: Lint the Go code
        run: make lint

      - name: Lint the Helm chart
        run: make lint-helm

      - name: Verify generated files and the rendered Helm chart
        run: make verify

      - name: Run unit tests
        run: make test
