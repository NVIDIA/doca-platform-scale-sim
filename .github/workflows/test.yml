name: Unit tests

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - 'main'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: make test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Cache tool binaries
        uses: actions/cache@v4
        with:
          path: bin
          key: ${{ runner.os }}-bin-${{ hashFiles('go.mod', 'Makefile') }}

      - name: Run unit tests
        run: make test

      - name: Check generated code and formatting are up to date
        run: |
          git diff --exit-code || {
            echo "::error::'make test' modified tracked files; run 'make manifests generate fmt' and commit the result."
            exit 1
          }
