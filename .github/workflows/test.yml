name: Unit tests

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - 'main'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: make test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Cache tool binaries
        uses: actions/cache@v6
        with:
          path: bin
          key: ${{ runner.os }}-bin-${{ hashFiles('go.mod', 'Makefile') }}
          # Tool binaries are named after their versions, so an older cache
          # can only supply tools whose version is unchanged.
          restore-keys: ${{ runner.os }}-bin-

      - name: Lint the Go code
        run: make lint

      - name: Lint the Helm chart
        run: make lint-helm

      - name: Verify generated files and the rendered Helm chart
        run: make verify

      # The mock-ovs tests drive the switch with ovs-vsctl and ovs-ofctl. They
      # fail, not skip, when the tools are missing and CI is set.
      - name: Install Open vSwitch tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends openvswitch-switch

      - name: Run unit tests
        run: make test

      - name: Run shell script tests
        run: make test-scripts
