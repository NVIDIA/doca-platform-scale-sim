name: Commit check

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  commit-check:
    name: make commit-check
    # Dependabot cannot sign off its commits, so the DCO policy would reject
    # every one of its pull requests.
    if: github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      # Check out the pull request head, not the merge commit GitHub creates,
      # whose message conform would reject.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Validate the pull request commit messages
        run: make commit-check CONFORM_FLAGS="--revision-range=${{ github.event.pull_request.base.sha }}..HEAD"
