name: e2e-pod

# The pod runtime suite builds a Kind cluster with DPF and no KubeVirt. It is
# opt-in on pull requests (add the e2e-pod label) and can be started by hand.
# It does not run on push to main. Its concurrency group is separate from the
# VM suite, so the two workflows can run at the same time.
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-pod-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # The pod runtime has no KubeVirt, so it needs neither /dev/kvm nor the VM
  # node image. It builds the node container image itself.
  e2e-pod:
    if: >-
      (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'e2e-pod')) ||
      (github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    # Must exceed E2E_POD_TEST_TIMEOUT (90m) plus the cluster, DPF and node
    # container image setup, or the job is killed before the suite reports.
    timeout-minutes: 150
    env:
      KUBECTL_VERSION: v1.36.4
      KIND_CLUSTER: simfleet-controller-test-e2e
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL \
            /usr/local/.ghcup /usr/share/swift /usr/local/share/boost /usr/local/share/powershell \
            /usr/local/share/chromium /usr/local/lib/node_modules /usr/lib/jvm /opt/microsoft \
            /opt/google /opt/az /opt/pipx /usr/local/julia* /opt/hostedtoolcache/PyPy \
            /opt/hostedtoolcache/Ruby /opt/hostedtoolcache/node /opt/hostedtoolcache/Java*
          sudo docker system prune --all --force
          df -h /
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          # mock-dpuagent brings its own module graph and toolchain. Keying on
          # mock.ref as well also keeps this cache apart from the unit test
          # workflow's, which would otherwise claim the same key without them.
          cache-dependency-path: |
            go.sum
            hack/dpuagent/mock.ref
      - name: Install kubectl
        run: |
          sudo curl -fsSLo /usr/local/bin/kubectl \
            "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl"
          sudo chmod +x /usr/local/bin/kubectl
          kubectl version --client
      - name: Run the pod runtime e2e suite
        run: make test-e2e-pod
      - name: Cluster state on failure
        if: failure()
        run: |
          df -h / || true
          docker system df || true
          docker exec "${KIND_CLUSTER}-control-plane" df -h /var/lib/containerd || true
          kubectl get pods -A -o wide || true
          kubectl get simfleets,siminstances -A || true
          kubectl get dpus,dpudevices,dpunodes -A || true
