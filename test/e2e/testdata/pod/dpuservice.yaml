# A DPUService with no dpuClusterSelector targets every DPUCluster, so DPF
# installs this chart on the simulated DPU's Node. The chart and image are the
# ones DPF's own suite deploys.
apiVersion: svc.dpu.nvidia.com/v1alpha1
kind: DPUService
metadata:
  name: e2e-hello
  namespace: dpf-operator-system
spec:
  serviceID: e2e-hello
  security:
    privileged: false
  helmChart:
    source:
      repoURL: https://helm.github.io/examples
      chart: hello-world
      version: 0.1.0
    values:
      image:
        repository: mirror.gcr.io/nginx
        tag: 1.27.4-alpine3.21-slim
