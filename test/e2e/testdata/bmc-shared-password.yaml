# The BMC password DPF authenticates to every mock BMC with. A DPUDevice that
# names no bmcCredentialSecretName, as the fleet's do, sends DPF to the shared
# Secret "bmc-shared-password" in the device's own namespace, and without it
# provisioning stops before the first Redfish call: no factory reset, no
# chassis read, so the DPUDevice never reports a DPU type and its DPU waits in
# Initializing forever.
#
# The value is arbitrary. The mock accepts every basic-auth login and keeps no
# password state, so this only has to be present and non-empty; it is a
# non-default password so the flow takes the ordinary path rather than DPF's
# factory-default handling.
apiVersion: v1
kind: Secret
metadata:
  name: bmc-shared-password
  namespace: dpf-operator-system
type: Opaque
stringData:
  password: simfleet-e2e-bmc
