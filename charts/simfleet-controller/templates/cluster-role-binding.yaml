apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: simfleet-controller-manager-rolebinding
  labels:
    app.kubernetes.io/component: rbac
  {{- include "simfleet-controller.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  # Fixed name: the ClusterRole in role.yaml is generated by controller-gen with this name.
  name: 'simfleet-controller-manager-role'
subjects:
- kind: ServiceAccount
  name: 'simfleet-controller-manager'
  namespace: '{{ .Release.Namespace }}'
