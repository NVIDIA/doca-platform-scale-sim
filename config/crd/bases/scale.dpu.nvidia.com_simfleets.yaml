---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
    helm.sh/resource-policy: keep
  name: simfleets.scale.dpu.nvidia.com
spec:
  group: scale.dpu.nvidia.com
  names:
    kind: SimFleet
    listKind: SimFleetList
    plural: simfleets
    singular: simfleet
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.replicas
      name: Replicas
      type: integer
    - jsonPath: .status.admittedReplicas
      name: Admitted
      type: integer
    - jsonPath: .status.provisionedInstances
      name: Provisioned
      type: integer
    - jsonPath: .status.failedInstances
      name: Failed
      type: integer
    - jsonPath: .status.conditions[?(@.type=='InventoryReconciled')].status
      name: Reconciled
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: SimFleet is the Schema for the simfleets API
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the desired state of SimFleet
            properties:
              deviceSelectionLabels:
                additionalProperties:
                  type: string
                description: |-
                  deviceSelectionLabels is the DPUSet selector the controller publishes
                  onto a DPUDevice once that device has a reachable BMC. It may not carry
                  a key from ReservedDeviceLabelKeys: those decide which fleet, ordinal,
                  and DPUNode a device belongs to, and the controller finds, adopts, and
                  cleans up its own inventory by them. Rejecting the selector
                  here is what tells the fleet author; the controller filters the same
                  keys anyway, so an object admitted before this rule still cannot
                  corrupt a device's identity.
                minProperties: 1
                type: object
                x-kubernetes-validations:
                - message: deviceSelectionLabels must not contain the controller-reserved
                    keys scale.dpu.nvidia.com/fleet-name, scale.dpu.nvidia.com/fleet-uid,
                    scale.dpu.nvidia.com/ordinal, or provisioning.dpu.nvidia.com/dpunode-name
                  rule: '!self.exists(k, k in [''scale.dpu.nvidia.com/fleet-name'',''scale.dpu.nvidia.com/fleet-uid'',''scale.dpu.nvidia.com/ordinal'',''provisioning.dpu.nvidia.com/dpunode-name''])'
              devicesPerDPUNode:
                minimum: 1
                type: integer
                x-kubernetes-validations:
                - message: devicesPerDPUNode is immutable
                  rule: self == oldSelf
              dpuAgent:
                description: |-
                  DPUAgentSpec configures the mock DPU agent each guest runs. Disabling it
                  also stops the guest from joining the DPU cluster: the guest gets no agent
                  configuration and no management credential, and both the agent and the
                  join unit are masked.
                properties:
                  bmc:
                    description: |-
                      Mock BMC settings. Unset fields keep the values the controller has
                      always rendered, which are the mock's own defaults.
                    properties:
                      firmware:
                        description: Firmware versions the mock BMC reports at power-on.
                        properties:
                          bmc:
                            maxLength: 64
                            minLength: 1
                            type: string
                          erot:
                            maxLength: 64
                            minLength: 1
                            type: string
                          nic:
                            maxLength: 64
                            minLength: 1
                            type: string
                          uefi:
                            maxLength: 64
                            minLength: 1
                            type: string
                        type: object
                      psid:
                        description: |-
                          PSID the mock BMC reports. Only BF4 reads it: it must be a key of
                          BlueFieldSoftware.spec.pldmFwBundle.
                        maxLength: 32
                        minLength: 1
                        type: string
                      responseDelay:
                        description: Random delay added to every Redfish response
                          that no override covers.
                        properties:
                          maxSeconds:
                            maximum: 600
                            minimum: 0
                            type: integer
                          minSeconds:
                            maximum: 600
                            minimum: 0
                            type: integer
                        required:
                        - maxSeconds
                        - minSeconds
                        type: object
                        x-kubernetes-validations:
                        - message: minSeconds must not exceed maxSeconds
                          rule: self.minSeconds <= self.maxSeconds
                      responseDelayOverrides:
                        description: Per-operation delay ranges that replace responseDelay.
                        items:
                          description: DPUAgentResponseDelayOverride gives one Redfish
                            operation its own delay range.
                          properties:
                            maxSeconds:
                              maximum: 600
                              minimum: 0
                              type: integer
                            methods:
                              description: |-
                                HTTP methods the override covers. Unset or ["*"] covers every method
                                the operation serves.
                              items:
                                enum:
                                - GET
                                - PATCH
                                - POST
                                - DELETE
                                - '*'
                                type: string
                              maxItems: 4
                              minItems: 1
                              type: array
                              x-kubernetes-list-type: set
                              x-kubernetes-validations:
                              - message: '"*" cannot be combined with other methods'
                                rule: '!(''*'' in self) || size(self) == 1'
                            minSeconds:
                              maximum: 600
                              minimum: 0
                              type: integer
                            name:
                              description: Operation name from the mock's route table,
                                see MockRedfishOperations.
                              enum:
                              - Account
                              - AccountService
                              - BMCRshim
                              - Bios
                              - BiosSettings
                              - CertificateService.GenerateCSR
                              - CertificateService.ReplaceCertificate
                              - Chassis
                              - ComputerSystem.Reset
                              - Drive
                              - FirmwareInventory
                              - HostPrivilegeConfig
                              - HostRshim.Set
                              - Manager
                              - Manager.Reset
                              - Manager.ResetToDefaults
                              - Managers
                              - Mode.Set
                              - NetworkAdapter
                              - NetworkDeviceFunction
                              - NetworkPort
                              - NvidiaChassis.AuxPowerReset
                              - NvidiaChassis.Reset
                              - NvidiaUpdateService.CommitImage
                              - Processor
                              - SELEntries
                              - SOC.ForceReset
                              - SecureBoot
                              - ServerCertificate
                              - ServiceRoot
                              - System
                              - SystemOem
                              - SystemSettings
                              - Systems
                              - Task
                              - TruststoreCertificates
                              - UpdateMultipart
                              - UpdateService
                              - UpdateService.Activate
                              - UpdateService.SimpleUpdate
                              - VirtualMedia
                              type: string
                          required:
                          - maxSeconds
                          - minSeconds
                          - name
                          type: object
                          x-kubernetes-validations:
                          - message: minSeconds must not exceed maxSeconds
                            rule: self.minSeconds <= self.maxSeconds
                          - message: methods must be served by the named Redfish operation
                            rule: '!has(self.methods) || self.methods.all(m, m ==
                              ''*'' || m in {''Account'': [''PATCH''], ''AccountService'':
                              [''PATCH''], ''BMCRshim'': [''GET'', ''PATCH''], ''Bios'':
                              [''GET''], ''BiosSettings'': [''PATCH''], ''CertificateService.GenerateCSR'':
                              [''POST''], ''CertificateService.ReplaceCertificate'':
                              [''POST''], ''Chassis'': [''GET''], ''ComputerSystem.Reset'':
                              [''POST''], ''Drive'': [''GET''], ''FirmwareInventory'':
                              [''GET''], ''HostPrivilegeConfig'': [''PATCH''], ''HostRshim.Set'':
                              [''POST''], ''Manager'': [''GET''], ''Manager.Reset'':
                              [''POST''], ''Manager.ResetToDefaults'': [''POST''],
                              ''Managers'': [''GET''], ''Mode.Set'': [''POST''], ''NetworkAdapter'':
                              [''GET''], ''NetworkDeviceFunction'': [''GET''], ''NetworkPort'':
                              [''GET''], ''NvidiaChassis.AuxPowerReset'': [''POST''],
                              ''NvidiaChassis.Reset'': [''POST''], ''NvidiaUpdateService.CommitImage'':
                              [''POST''], ''Processor'': [''GET''], ''SELEntries'':
                              [''GET''], ''SOC.ForceReset'': [''POST''], ''SecureBoot'':
                              [''GET'', ''PATCH''], ''ServerCertificate'': [''GET''],
                              ''ServiceRoot'': [''GET''], ''System'': [''GET''], ''SystemOem'':
                              [''GET''], ''SystemSettings'': [''GET'', ''PATCH''],
                              ''Systems'': [''GET''], ''Task'': [''GET''], ''TruststoreCertificates'':
                              [''DELETE'', ''GET'', ''POST''], ''UpdateMultipart'':
                              [''POST''], ''UpdateService'': [''GET'', ''POST''],
                              ''UpdateService.Activate'': [''POST''], ''UpdateService.SimpleUpdate'':
                              [''POST''], ''VirtualMedia'': [''GET'', ''POST'']}[self.name])'
                        maxItems: 32
                        type: array
                        x-kubernetes-list-type: atomic
                        x-kubernetes-validations:
                        - message: responseDelayOverrides must not cover the same
                            operation and method twice
                          rule: self.all(a, self.exists_one(b, b.name == a.name &&
                            (!has(a.methods) || !has(b.methods) || '*' in a.methods
                            || '*' in b.methods || a.methods.exists(m, m in b.methods))))
                    type: object
                  dpuType:
                    default: bf3
                    enum:
                    - bf3
                    - bf4
                    type: string
                  enabled:
                    default: true
                    type: boolean
                  phaseDelays:
                    description: |-
                      Extra time the mock spends in the steps it controls while the DPU is in
                      a phase; see the mock-dpuagent "Phase delays" section. The range applies
                      on every pass through the phase. OS Installing counts against DPF's
                      --os-install-timeout.
                    items:
                      description: |-
                        DPUAgentPhaseDelay is a closed range of whole seconds the mock adds to one
                        DPU phase.
                      properties:
                        maxSeconds:
                          format: int32
                          maximum: 3600
                          minimum: 0
                          type: integer
                        minSeconds:
                          format: int32
                          maximum: 3600
                          minimum: 0
                          type: integer
                        phase:
                          description: DPU phase as shown in DPU.status.phase, see
                            MockDelayablePhases.
                          enum:
                          - Update Firmware
                          - OS Installing
                          - Rebooting
                          - DPU Config
                          - DPU Cluster Config
                          - Service Readiness
                          type: string
                      required:
                      - maxSeconds
                      - minSeconds
                      - phase
                      type: object
                      x-kubernetes-validations:
                      - message: minSeconds must not exceed maxSeconds
                        rule: self.minSeconds <= self.maxSeconds
                    type: array
                    x-kubernetes-list-map-keys:
                    - phase
                    x-kubernetes-list-type: map
                  rebootMethod:
                    default: NoAction
                    description: Comma-separated mock reboot methods. Kind e2e uses
                      the default.
                    pattern: ^(NoAction|PowerCycle|SLR)(,(NoAction|PowerCycle|SLR))*$
                    type: string
                type: object
              dpuDeviceTemplate:
                description: |-
                  DPUDeviceTemplate shapes the DPUDevice created for each ordinal. Reserved
                  device label keys in its labels are silently dropped.
                properties:
                  metadata:
                    description: |-
                      TemplateMetadata is the metadata copied onto the objects a template
                      renders. Labels never override the controller's own identity labels.
                    properties:
                      labels:
                        additionalProperties:
                          type: string
                        type: object
                    type: object
                  spec:
                    description: |-
                      DPUDeviceTemplateSpec sets DPUDevice spec fields when the DPUDevice is
                      created; later edits do not change existing DPUDevices. An unset numberOfPFs
                      defaults to 1.
                    properties:
                      numberOfPFs:
                        type: integer
                    type: object
                type: object
              dpuNodeTemplate:
                description: DPUNodeTemplate shapes the DPUNode the fleet creates
                  for each host.
                properties:
                  metadata:
                    description: |-
                      TemplateMetadata is the metadata copied onto the objects a template
                      renders. Labels never override the controller's own identity labels.
                    properties:
                      labels:
                        additionalProperties:
                          type: string
                        type: object
                    type: object
                  spec:
                    description: |-
                      DPUNodeTemplateSpec sets DPUNode spec fields when the DPUNode is created;
                      later edits do not change existing DPUNodes. An unset nodeRebootMethod
                      defaults to external: {}.
                    properties:
                      nodeRebootMethod:
                        description: NodeRebootMethod defines the desired reboot method
                        properties:
                          external:
                            description: |-
                              Reboot the host via an external means, not controlled by the DPU
                              controller.
                            type: object
                          gNOI:
                            description: |-
                              Use the DPU's DMS interface to reboot the host.

                              Deprecated: Use HostAgent instead.
                            type: object
                          hostAgent:
                            description: Use the HostAgent to reboot the host.
                            type: object
                          none:
                            description: |-
                              Do not reboot a host through the DPUNode. Used for hostless devices where
                              DPF manages the DPU reboot directly through Redfish.
                            type: object
                          script:
                            description: |-
                              Reboot the host by executing a custom script. This field defined which
                              ConfigMap store the custom script. The ConfigMap should include a pod
                              template of Job object under the `pod-template` key. That pod template
                              will be put in a Job object to be executed.
                            properties:
                              name:
                                minLength: 1
                                type: string
                            required:
                            - name
                            type: object
                        type: object
                        x-kubernetes-validations:
                        - message: only one of hostAgent, external, script, none can
                            be set
                          rule: (((has(self.hostAgent) || has(self.gNOI)) && !has(self.external)
                            && !has(self.script) && !has(self.none)) || (has(self.external)
                            && !has(self.hostAgent) && !has(self.gNOI) && !has(self.script)
                            && !has(self.none)) || (has(self.script) && !has(self.external)
                            && !has(self.hostAgent) && !has(self.gNOI) && !has(self.none))
                            || (has(self.none) && !has(self.external) && !has(self.hostAgent)
                            && !has(self.gNOI) && !has(self.script)))
                    type: object
                type: object
              podTemplate:
                description: |-
                  PodTemplate shapes the Pod that backs each simulated DPU when the fleet
                  runs its DPUs as containers instead of KubeVirt VMs. The Pod is privileged.
                properties:
                  image:
                    minLength: 1
                    type: string
                  metadata:
                    description: |-
                      TemplateMetadata is the metadata copied onto the objects a template
                      renders. Labels never override the controller's own identity labels.
                    properties:
                      labels:
                        additionalProperties:
                          type: string
                        type: object
                    type: object
                  nodeSelector:
                    additionalProperties:
                      type: string
                    type: object
                  resources:
                    description: |-
                      A missing cpu request defaults to 100m and a missing memory request to
                      800Mi in the controller. Do not kubebuilder-default those values: a
                      default on this object would overwrite an explicit empty resources
                      object. Other requests and all limits pass through unchanged.
                    properties:
                      claims:
                        description: |-
                          Claims lists the names of resources, defined in spec.resourceClaims,
                          that are used by this container.

                          This field depends on the
                          DynamicResourceAllocation feature gate.

                          This field is immutable. It can only be set for containers.
                        items:
                          description: ResourceClaim references one entry in PodSpec.ResourceClaims.
                          properties:
                            name:
                              description: |-
                                Name must match the name of one entry in pod.spec.resourceClaims of
                                the Pod where this field is used. It makes that resource available
                                inside a container.
                              type: string
                            request:
                              description: |-
                                Request is the name chosen for a request in the referenced claim.
                                If empty, everything from the claim is made available, otherwise
                                only the result of this request.
                              type: string
                          required:
                          - name
                          type: object
                        type: array
                        x-kubernetes-list-map-keys:
                        - name
                        x-kubernetes-list-type: map
                      limits:
                        additionalProperties:
                          anyOf:
                          - type: integer
                          - type: string
                          pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                          x-kubernetes-int-or-string: true
                        description: |-
                          Limits describes the maximum amount of compute resources allowed.
                          More info: https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
                        type: object
                      requests:
                        additionalProperties:
                          anyOf:
                          - type: integer
                          - type: string
                          pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                          x-kubernetes-int-or-string: true
                        description: |-
                          Requests describes the minimum amount of compute resources required.
                          If Requests is omitted for a container, it defaults to Limits if that is explicitly specified,
                          otherwise to an implementation-defined value. Requests cannot exceed Limits.
                          More info: https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
                        type: object
                    type: object
                  tolerations:
                    items:
                      description: |-
                        The pod this Toleration is attached to tolerates any taint that matches
                        the triple <key,value,effect> using the matching operator <operator>.
                      properties:
                        effect:
                          description: |-
                            Effect indicates the taint effect to match. Empty means match all taint effects.
                            When specified, allowed values are NoSchedule, PreferNoSchedule and NoExecute.
                          type: string
                        key:
                          description: |-
                            Key is the taint key that the toleration applies to. Empty means match all taint keys.
                            If the key is empty, operator must be Exists; this combination means to match all values and all keys.
                          type: string
                        operator:
                          description: |-
                            Operator represents a key's relationship to the value.
                            Valid operators are Exists, Equal, Lt, and Gt. Defaults to Equal.
                            Exists is equivalent to wildcard for value, so that a pod can
                            tolerate all taints of a particular category.
                            Lt and Gt perform numeric comparisons (requires feature gate TaintTolerationComparisonOperators).
                          type: string
                        tolerationSeconds:
                          description: |-
                            TolerationSeconds represents the period of time the toleration (which must be
                            of effect NoExecute, otherwise this field is ignored) tolerates the taint. By default,
                            it is not set, which means tolerate the taint forever (do not evict). Zero and
                            negative values will be treated as 0 (evict immediately) by the system.
                          format: int64
                          type: integer
                        value:
                          description: |-
                            Value is the taint value the toleration matches to.
                            If the operator is Exists, the value should be empty, otherwise just a regular string.
                          type: string
                      type: object
                    type: array
                required:
                - image
                type: object
              replicas:
                minimum: 0
                type: integer
              virtualMachineTemplate:
                description: |-
                  VirtualMachineTemplate shapes the KubeVirt VirtualMachine that backs each
                  simulated DPU. A fleet without one boots no guests.
                properties:
                  architecture:
                    default: amd64
                    description: Guest ISA copied onto the KubeVirt VirtualMachine.
                    enum:
                    - amd64
                    - arm64
                    type: string
                  image:
                    minLength: 1
                    type: string
                  metadata:
                    description: |-
                      TemplateMetadata is the metadata copied onto the objects a template
                      renders. Labels never override the controller's own identity labels.
                    properties:
                      labels:
                        additionalProperties:
                          type: string
                        type: object
                    type: object
                  nodeSelector:
                    additionalProperties:
                      type: string
                    type: object
                  podNetwork:
                    description: |-
                      PodNetwork configures the guest's pod network interface. Only bridge
                      binding is supported; the controller refuses bridge: false.
                    properties:
                      bridge:
                        default: true
                        type: boolean
                    type: object
                  resources:
                    description: |-
                      VirtualMachineResources are the guest's resource requests. A missing cpu
                      request defaults to 1 and a missing memory request to 1Gi; other requests
                      pass through unchanged.
                    properties:
                      requests:
                        additionalProperties:
                          anyOf:
                          - type: integer
                          - type: string
                          pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                          x-kubernetes-int-or-string: true
                        description: ResourceList is a set of (resource name, quantity)
                          pairs.
                        type: object
                    type: object
                  runStrategy:
                    default: Always
                    description: |-
                      Unsupported values are rejected by the controller rather than the API
                      server, so the status condition can name the strategy that was refused.
                    type: string
                  storage:
                    description: |-
                      VirtualMachineStorage describes the guest's root disk. Only ephemeral
                      container-disk storage is supported; the controller refuses ephemeral: false.
                      rootDiskSize is accepted but not yet applied.
                    properties:
                      ephemeral:
                        default: true
                        type: boolean
                      rootDiskSize:
                        type: string
                    type: object
                  tolerations:
                    items:
                      description: |-
                        The pod this Toleration is attached to tolerates any taint that matches
                        the triple <key,value,effect> using the matching operator <operator>.
                      properties:
                        effect:
                          description: |-
                            Effect indicates the taint effect to match. Empty means match all taint effects.
                            When specified, allowed values are NoSchedule, PreferNoSchedule and NoExecute.
                          type: string
                        key:
                          description: |-
                            Key is the taint key that the toleration applies to. Empty means match all taint keys.
                            If the key is empty, operator must be Exists; this combination means to match all values and all keys.
                          type: string
                        operator:
                          description: |-
                            Operator represents a key's relationship to the value.
                            Valid operators are Exists, Equal, Lt, and Gt. Defaults to Equal.
                            Exists is equivalent to wildcard for value, so that a pod can
                            tolerate all taints of a particular category.
                            Lt and Gt perform numeric comparisons (requires feature gate TaintTolerationComparisonOperators).
                          type: string
                        tolerationSeconds:
                          description: |-
                            TolerationSeconds represents the period of time the toleration (which must be
                            of effect NoExecute, otherwise this field is ignored) tolerates the taint. By default,
                            it is not set, which means tolerate the taint forever (do not evict). Zero and
                            negative values will be treated as 0 (evict immediately) by the system.
                          format: int64
                          type: integer
                        value:
                          description: |-
                            Value is the taint value the toleration matches to.
                            If the operator is Exists, the value should be empty, otherwise just a regular string.
                          type: string
                      type: object
                    type: array
                required:
                - image
                type: object
            required:
            - deviceSelectionLabels
            - devicesPerDPUNode
            - replicas
            type: object
            x-kubernetes-validations:
            - message: spec.dpuAgent is immutable
              rule: '!has(oldSelf.dpuAgent) ? !has(self.dpuAgent) : self.dpuAgent
                == oldSelf.dpuAgent'
            - message: virtualMachineTemplate and podTemplate are mutually exclusive
              rule: '!(has(self.virtualMachineTemplate) && has(self.podTemplate))'
            - message: virtualMachineTemplate cannot be removed once set
              rule: '!has(oldSelf.virtualMachineTemplate) || has(self.virtualMachineTemplate)'
            - message: podTemplate cannot be removed once set
              rule: '!has(oldSelf.podTemplate) || has(self.podTemplate)'
          status:
            description: status defines the observed state of SimFleet
            properties:
              admittedReplicas:
                description: |-
                  AdmittedReplicas is the rollout index: SimInstances [0, admittedReplicas)
                  should exist.
                type: integer
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
